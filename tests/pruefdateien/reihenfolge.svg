<?xml version="1.0" encoding="UTF-8"?>
<!-- PRUEFDATEI, kein ausgeliefertes Symbol.
     Sie bildet genau den Fall nach, an dem die erste Fassung der Umrechnung
     gescheitert ist: eine schwarze Flaeche, darauf eine weisse (das Loch),
     und DARIN wieder eine schwarze (ein Punkt im Loch). Wer nur die weissen
     Teile in die Maske schreibt, loescht den Punkt mit weg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pruefdatei">
  <g fill="currentColor">
    <rect x="4" y="4" width="56" height="56"/>
    <circle cx="32" cy="32" r="18" fill="#fff"/>
    <circle cx="32" cy="32" r="6"/>
  </g>
</svg>
