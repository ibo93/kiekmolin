# Laesst bei jedem Push alle Tests laufen: die der App selbst und die der
# KI-Agentur-Projekte.
#
# Die App-Tests standen jahrelang nur zum Selberstarten bereit -- knapp 2100
# Stueck, die niemand automatisch ausfuehrte. Aufgefallen ist das an einem
# konkreten Fall: beim Zusammenfuehren zweier Zweige entstanden zwei Aufrufe,
# die wieder mit dem oeffentlichen Schluessel an die Datenbank gingen. Git
# meldete keinen Konflikt, der Test schon -- nur lief er eben nicht.
# Ein Netz, das man von Hand spannen muss, ist beim Sturz meistens unten.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Die App selbst: index.html, sw.js und die Netlify-Functions. Die Tests
  # schneiden die echten Funktionen heraus und fuehren sie gegen nachgebaute
  # API-Antworten aus -- ohne Netz, ohne Browser, ohne Datenbank.
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App-Tests (tests/run-all.js)
        run: node tests/run-all.js

  agentur-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Telefon-Retter Abhaengigkeiten (ws)
        run: cd telefon-retter && npm install --no-audit --no-fund

      - name: Syntax-Check aller Projekt-Dateien
        run: |
          for f in telefon-retter/server.js telefon-retter/simulator.js telefon-retter/test.js telefon-retter/lib/*.js \
                   sichtbarkeit/sichtbarkeit.js sichtbarkeit/test.js sichtbarkeit/lib/*.js \
                   agentur/server.js agentur/test.js agentur/lib/*.js; do
            node --check "$f"
          done

      - name: Telefon-Retter Tests
        run: cd telefon-retter && node test.js

      - name: Sichtbarkeit Tests
        run: cd sichtbarkeit && node test.js

      - name: Agentur Tests
        run: cd agentur && node test.js

      - name: SEO-Seiten Tests
        run: node test-seo.js

      - name: Sichtbarkeit Demo-Report (Rauchtest)
        run: cd sichtbarkeit && node sichtbarkeit.js report --demo
