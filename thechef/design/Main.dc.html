<style>

      <div style="height: 8px; border-radius: 4px; background: #D6D3CA"></div>
      <div style="height: 8px; border-radius: 4px; background: #D6D3CA"></div>

      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; opacity: .9">{{t.now}}</span><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.3px">{{t.a2}}</span></span>
      <span style="width: 72px; height: 72px; border-radius: 36px; background: #FFFFFF; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.18); animation: breathe 3.2s ease-in-out 1.2s infinite"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>

      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 700">{{t.a3}}</span><span style="font-size: 15px; font-weight: 600; color: #5F5E5A">{{t.open}}</span></span>
      <span style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; border: 2px dashed #B9B6AD"></span>
    </div>
  </div>
  <a href="Weggeworfen.dc.html" style="align-self: center; margin-top: 4px; height: 52px; padding: 0 22px; border-radius: 26px; text-decoration: none; background: rgba(255,255,255,0.24); backdrop-filter: blur(12px) saturate(210%) brightness(1.06); -webkit-backdrop-filter: blur(12px) saturate(210%) brightness(1.06); border: none; box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,0.95), inset -1px -1px 0 rgba(255,255,255,0.55), inset 0 0 18px rgba(255,255,255,0.5), 0 10px 28px rgba(20,20,19,0.14), 0 1px 3px rgba(20,20,19,0.08); color: #141413; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; animation: rise .5s cubic-bezier(.2,.8,.2,1) .2s both"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg> {{t.waste}}</a>
</div>
</x-dc>
