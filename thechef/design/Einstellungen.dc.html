<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Darstellung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;background:#F4F3EF;color:#141413}
a{color:#1F4FD1}a:hover{color:#173C9E}
button,a{transition:transform .15s ease, background .3s ease, color .3s ease}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 58px 16px 0 16px; background: {{pageBg}}; color: {{text}}; display: flex; flex-direction: column; gap: 14px; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; transition: background .35s ease, color .35s ease">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Assistent.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 22px; background: {{glassBg}}; backdrop-filter: blur(12px) saturate(200%); -webkit-backdrop-filter: blur(12px) saturate(200%); box-shadow: {{glassShadow}}; color: {{text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
  </div>
  <h1 style="margin: -6px 0 0 0; padding: 0 4px; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Darstellung</h1>

  <div style="background: {{tileBg}}; border-radius: 24px; padding: 12px; transition: background .35s ease">
    <div style="position: relative; height: 150px; border-radius: 18px; overflow: hidden; background: {{prevBg}}; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; transition: background .35s ease">
      <div style="font-size: 12px; font-weight: 600; color: {{text2}}">Ware im Lager</div>
      <div style="font-family: 'Bricolage Grotesque', -apple-system, sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05; color: {{acc}}; transition: color .3s ease">1.240 €</div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 6px; align-items: flex-end; height: 40px">
        <div style="flex-grow: 1; height: 22px; border-radius: 6px; background: #34C759"></div>
        <div style="flex-grow: 1; height: 34px; border-radius: 6px; background: #FF9500"></div>
        <div style="flex-grow: 1; height: 18px; border-radius: 6px; background: #0A84FF"></div>
        <div style="flex-grow: 1; height: 40px; border-radius: 6px; background: {{acc}}"></div>
        <div style="flex-grow: 1; height: 26px; border-radius: 6px; background: #AF52DE"></div>
      </div>
      <div style="position: absolute; left: 40px; right: 70px; bottom: 12px; height: 38px; border-radius: 19px; background: {{prevGlass}}; backdrop-filter: blur(10px) saturate(200%); -webkit-backdrop-filter: blur(10px) saturate(200%); box-shadow: {{glassShadow}}; display: flex; align-items: center; justify-content: space-around; transition: background .3s ease">
        <div style="width: 40px; height: 26px; border-radius: 13px; background: {{lensBg}}; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 5px; background: {{acc}}"></div></div>
        <div style="width: 10px; height: 10px; border-radius: 5px; background: {{text2}}"></div>
        <div style="width: 10px; height: 10px; border-radius: 5px; background: {{text2}}"></div>
      </div>
      <div style="position: absolute; right: 16px; bottom: 12px; width: 38px; height: 38px; border-radius: 19px; background: {{acc}}; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5)"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 0 4px; font-size: 13px; font-weight: 600; color: {{text2}}">MODUS</div>
    <div style="background: {{tileBg}}; border-radius: 20px; padding: 14px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; transition: background .35s ease">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button onClick="{{m.pick}}" style="border: none; background: transparent; font: inherit; color: {{text}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0">
          <div style="width: 58px; height: 96px; border-radius: 14px; background: {{m.frameBg}}; border: {{m.frameBorder}}; box-sizing: border-box; padding: 10px 8px; display: flex; flex-direction: column; gap: 5px">
            <div style="height: 8px; width: 70%; border-radius: 4px; background: {{m.lineA}}"></div>
            <div style="height: 18px; border-radius: 6px; background: {{m.lineB}}"></div>
            <div style="height: 18px; border-radius: 6px; background: {{m.lineB}}"></div>
          </div>
          <div style="font-size: 14px; font-weight: 600">{{m.label}}</div>
          <div style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{m.radioBorder}}; background: {{m.radioBg}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
            <sc-if value="{{m.sel}}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </div>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 0 4px; font-size: 13px; font-weight: 600; color: {{text2}}">AKZENTFARBE</div>
    <div style="background: {{tileBg}}; border-radius: 20px; padding: 14px 16px; display: flex; justify-content: space-between; transition: background .35s ease">
      <sc-for list="{{accents}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-label="{{c.name}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; cursor: pointer; background: transparent; box-shadow: {{c.ring}}; display: flex; align-items: center; justify-content: center">
          <div style="width: 34px; height: 34px; border-radius: 17px; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.45), rgba(255,255,255,0) 55%), {{c.hex}}"></div>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 0 4px; font-size: 13px; font-weight: 600; color: {{text2}}">GLAS</div>
    <div style="background: {{tileBg}}; border-radius: 20px; display: flex; flex-direction: column; transition: background .35s ease">
      <div style="padding: 12px 12px 10px 12px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 20px; background: {{segBg}}">
          <button onClick="{{pickKlar}}" style="height: 36px; border: none; border-radius: 17px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{klarBg}}; color: {{text}}; box-shadow: {{klarShadow}}">Klar</button>
          <button onClick="{{pickTint}}" style="height: 36px; border: none; border-radius: 17px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{tintBg}}; color: {{text}}; box-shadow: {{tintShadow}}">Getönt</button>
        </div>
      </div>
      <div style="border-top: 1px solid {{line}}; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 600">Bewegungen</div>
          <div style="font-size: 13px; color: {{text2}}">Kurze Animationen beim Öffnen</div>
        </div>
        <button onClick="{{toggleMotion}}" aria-label="Bewegungen an oder aus" style="position: relative; width: 52px; height: 32px; flex-shrink: 0; border: none; border-radius: 16px; cursor: pointer; background: {{switchBg}}; padding: 0">
          <div style="position: absolute; top: 2px; left: {{knobLeft}}; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: left .25s cubic-bezier(.2,.8,.2,1)"></div>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'hell', acc: 0, glass: 'klar', motion: true };
  }
  renderVals() {
    const s = this.state;
    const dark = s.mode === 'dunkel';
    const A = [
      { name: 'Blau', light: '#1F4FD1', dark: '#2F6BFF' },
      { name: 'Grün', light: '#0E7A4E', dark: '#30D158' },
      { name: 'Orange', light: '#C25A06', dark: '#FF9F0A' },
      { name: 'Lila', light: '#6A2FB8', dark: '#BF5AF2' },
      { name: 'Rot', light: '#C8213F', dark: '#FF453A' },
      { name: 'Petrol', light: '#0E6E7A', dark: '#40C8E0' }
    ];
    const acc = dark ? A[s.acc].dark : A[s.acc].light;
    const text = dark ? '#F5F5F7' : '#141413';
    const text2 = dark ? '#A1A1A6' : '#5F5E5A';
    const tileBg = dark ? '#1C1C1E' : '#FFFFFF';
    const line = dark ? '#2C2C2E' : '#EFEDE8';
    const clear = s.glass === 'klar';
    const prevGlass = dark ? (clear ? 'rgba(40,40,44,0.35)' : 'rgba(30,30,32,0.88)') : (clear ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.82)');
    const glassShadow = dark
      ? 'inset 1px 1px 0 rgba(255,255,255,0.3), inset -1px -1px 0 rgba(255,255,255,0.1), 0 6px 18px rgba(0,0,0,0.4)'
      : 'inset 1.5px 1.5px 0 rgba(255,255,255,0.95), inset -1px -1px 0 rgba(255,255,255,0.55), inset 0 0 14px rgba(255,255,255,0.45), 0 6px 18px rgba(20,20,19,0.12)';
    const lensOn = dark ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.75)';
    const modeDefs = [
      { id: 'hell', label: 'Hell', frameBg: '#F4F3EF', lineA: '#D6D3CA', lineB: '#FFFFFF' },
      { id: 'dunkel', label: 'Dunkel', frameBg: '#050506', lineA: '#3A3A3C', lineB: '#1C1C1E' },
      { id: 'auto', label: 'Automatisch', frameBg: 'linear-gradient(90deg, #F4F3EF 50%, #050506 50%)', lineA: '#8E8E93', lineB: 'linear-gradient(90deg, #FFFFFF 50%, #1C1C1E 50%)' }
    ];
    const modes = modeDefs.map((m) => {
      const sel = s.mode === m.id;
      return {
        ...m,
        sel,
        frameBorder: sel ? '2.5px solid ' + acc : '1px solid ' + (dark ? '#3A3A3C' : '#D6D3CA'),
        radioBorder: sel ? 'none' : '1.5px solid ' + (dark ? '#636366' : '#C7C7CC'),
        radioBg: sel ? acc : 'transparent',
        pick: () => this.setState({ mode: m.id })
      };
    });
    const accents = A.map((c, i) => ({
      name: c.name,
      hex: dark ? c.dark : c.light,
      ring: i === s.acc ? '0 0 0 2.5px ' + (dark ? c.dark : c.light) : 'none',
      pick: () => this.setState({ acc: i })
    }));
    const selBg = dark ? 'rgba(255,255,255,0.16)' : '#FFFFFF';
    const selShadow = dark ? 'inset 1px 1px 0 rgba(255,255,255,0.2)' : '0 2px 8px rgba(20,20,19,0.10)';
    return {
      acc, text, text2, tileBg, line,
      pageBg: dark ? '#050506' : '#F4F3EF',
      prevBg: dark ? '#050506' : '#F4F3EF',
      glassBg: dark ? 'rgba(40,40,44,0.45)' : 'rgba(255,255,255,0.4)',
      glassShadow, prevGlass, lensBg: lensOn,
      segBg: dark ? '#2C2C2E' : '#F1F0EC',
      klarBg: clear ? selBg : 'transparent', klarShadow: clear ? selShadow : 'none',
      tintBg: !clear ? selBg : 'transparent', tintShadow: !clear ? selShadow : 'none',
      pickKlar: () => this.setState({ glass: 'klar' }),
      pickTint: () => this.setState({ glass: 'getoent' }),
      switchBg: s.motion ? acc : (dark ? '#39393D' : '#E9E9EA'),
      knobLeft: s.motion ? '22px' : '2px',
      toggleMotion: () => this.setState({ motion: !s.motion }),
      modes, accents
    };
  }
}
</script>
</body>
</html>
