<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;background:#1F4FD1;color:#141413}
a{color:#1F4FD1}a:hover{color:#173C9E}
button,a{transition:transform .15s ease}
button:active,a:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(31,79,209,.28)}50%{box-shadow:0 0 0 18px rgba(31,79,209,0)}}
@keyframes iconIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes cTL{from{opacity:0;transform:translate(-26px,-26px)}to{opacity:1;transform:none}}
@keyframes cTR{from{opacity:0;transform:translate(26px,-26px)}to{opacity:1;transform:none}}
@keyframes cBL{from{opacity:0;transform:translate(-26px,26px)}to{opacity:1;transform:none}}
@keyframes cBR{from{opacity:0;transform:translate(26px,26px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{top:6%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:90%;opacity:0}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes bar{from{width:0}to{width:100%}}
@keyframes spread{from{letter-spacing:14px;opacity:0}to{letter-spacing:6px;opacity:.85}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<a href="Main.dc.html" aria-label="App öffnen" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-decoration: none; color: #FFFFFF; background: radial-gradient(circle at 50% 32%, rgba(255,255,255,0.22), rgba(255,255,255,0) 58%), {{accent}}; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div style="position: relative; width: 196px; height: 196px">

    <div style="position: absolute; left: 30px; top: 30px; width: 136px; height: 136px; border-radius: 38px; background: rgba(255,255,255,0.16); box-shadow: inset 2px 2px 0 rgba(255,255,255,0.7), inset -1px -1px 0 rgba(255,255,255,0.25), inset 0 0 24px rgba(255,255,255,0.22), 0 24px 44px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; animation: iconIn .9s cubic-bezier(.2,.8,.2,1) .1s both">
      <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 14a4 4 0 0 1-1.6-7.7A4.6 4.6 0 0 1 12 3.6a4.6 4.6 0 0 1 6.6 2.7A4 4 0 0 1 17 14v5.5H7z" pathLength="100" stroke-dasharray="100" style="animation: draw 1s ease-in-out 1.15s both"></path>
        <path d="M7 16.8h10" pathLength="100" stroke-dasharray="100" style="animation: draw .4s ease-out 1.9s both"></path>
      </svg>
    </div>
    <div style="position: absolute; left: 18px; right: 18px; height: 3px; border-radius: 2px; background: #FFFFFF; box-shadow: 0 0 18px 5px rgba(255,255,255,0.75); animation: sweep 1.1s ease-in-out .95s both"></div>
    <div style="position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; border-radius: 15px; background: #34C759; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px {{accent}}; animation: pop .5s cubic-bezier(.2,.8,.2,1) 2.15s both"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
    <div style="font-size: 15px; font-weight: 800; letter-spacing: 6px; opacity: .85; padding-left: 6px; animation: spread .9s cubic-bezier(.2,.8,.2,1) 2.3s both">THE</div>
    <div style="font-family: 'Bricolage Grotesque', -apple-system, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) 2.4s both">Chef</div>
    <div style="margin-top: 14px; font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.9); animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) 2.75s both">Dein Lager. Immer im Blick.</div>
  </div>
  <div style="position: absolute; bottom: 64px; width: 64px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); overflow: hidden; animation: fadeIn .4s ease 2.9s both">
    <div style="height: 4px; border-radius: 2px; background: #FFFFFF; animation: bar 1s linear 3s both"></div>
  </div>
  <div style="position: absolute; bottom: 30px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); animation: fadeIn .5s ease 4.1s both">Tippen zum Starten</div>
</a>
