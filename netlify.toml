# Kiek mol in - Netlify Konfiguration

[build]
  # 1. OSM-Import: holt alle Gastro-Betriebe der Region frisch nach prospects.json
  #    (Netlify-Build hat Internet -> Overpass erreichbar). Daraus baut Schritt 2
  #    die Verzeichnis-/SEO-Seiten der Nicht-Partner (mehr Google-Reichweite).
  # 2. SEO-Landing-Pages aus Supabase (Partner) + prospects.json (Nicht-Partner).
  # 3. Minifizieren. 4. Build-Ausweis nach /version.txt schreiben.
  # Fault-tolerant: Schlaegt ein Schritt fehl, wird trotzdem deployed.
  #
  # Schritt 4 steht ABSICHTLICH am Ende und ohne "|| echo": er haengt von nichts
  # ab (liest nur Umgebungsvariablen, schreibt eine Textdatei) und beantwortet
  # danach die Frage, die uns einen halben Tag gekostet hat -- naemlich WELCHER
  # Commit hier eigentlich liegt. Ein alter Deploy meldet dasselbe "ready" wie
  # ein frischer; kiekmolin.de/version.txt sagt die Wahrheit.
  command = "node import-osm.js || echo 'OSM import failed - continuing'; node build-seo-pages.js || echo 'SEO build script failed - continuing'; node minify-build.js || echo 'Minify failed - continuing'; node build-version.js"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Cache-Header: index.html und sw.js NIE laenger cachen, damit Nutzer nach
# einem Deploy sofort die neue Version bekommen (sonst haelt der Browser eine
# alte Kopie zurueck). sw.js wird zusaetzlich pro Build neu gestempelt.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Pretty URLs ohne .html
# ==========================================================
# Werkzeug-Ordner aus dem Netz nehmen
#
# publish = "." veroeffentlicht das ganze Verzeichnis. Damit lagen
# agentur/server.js, die Bibliotheken und der Telefon-Code offen im
# Netz abrufbar - keine Schluessel darin, aber die komplette
# Arbeitsweise zum Nachlesen.
#
# force = true ist noetig: ohne das gewinnt die vorhandene Datei.
# Diese Bloecke muessen VOR allen anderen Regeln stehen.
# ==========================================================

[[redirects]]
  from = "/agentur/*"
  to = "/404.html"
  status = 404
  force = true

# Die Interessentenliste: 1642 Betriebe mit Namen und Telefonnummern.
# Der Build erzeugt sie im Wurzelverzeichnis, von wo aus sie ohne diese
# Sperre unter kiekmolin.de/prospects.json zum Herunterladen bereitlaege.
[[redirects]]
  from = "/prospects.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/telefon-retter/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sichtbarkeit/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pizzeria-:city"
  to = "/pizzeria-:city.html"
  status = 200

[[redirects]]
  from = "/doener-:city"
  to = "/doener-:city.html"
  status = 200

[[redirects]]
  from = "/fischrestaurant-:city"
  to = "/fischrestaurant-:city.html"
  status = 200

[[redirects]]
  from = "/griechisches-restaurant-:city"
  to = "/griechisches-restaurant-:city.html"
  status = 200

# Hinweis: /restaurant-:city gibt es bewusst NICHT -- der Generator ueberspringt
# die Kategorie "restaurant" (nur /restaurants-:city als Ortsuebersicht).

[[redirects]]
  from = "/cafe-:city"
  to = "/cafe-:city.html"
  status = 200

[[redirects]]
  from = "/restaurants-:city"
  to = "/restaurants-:city.html"
  status = 200

# Englische SEO-Seiten unter /en/...  (Pretty URLs ohne .html)
[[redirects]]
  from = "/en/pizzeria-:city"
  to = "/en/pizzeria-:city.html"
  status = 200

[[redirects]]
  from = "/en/doener-:city"
  to = "/en/doener-:city.html"
  status = 200

[[redirects]]
  from = "/en/fischrestaurant-:city"
  to = "/en/fischrestaurant-:city.html"
  status = 200

[[redirects]]
  from = "/en/griechisches-restaurant-:city"
  to = "/en/griechisches-restaurant-:city.html"
  status = 200

[[redirects]]
  from = "/en/restaurants-:city"
  to = "/en/restaurants-:city.html"
  status = 200

# Wirte-Seite (Sichtbarkeits-Check fuer Gastronomen) unter /check erreichbar.
# MUSS vor dem Catch-All stehen, sonst landet /check in der Gaeste-App.
[[redirects]]
  from = "/check"
  to = "/check.html"
  status = 200

# WinOrder-Kassen-Schnittstelle: WinOrder pollt /wo/<restaurant>/<key>/GetNewOrders
# usw. -> wird auf die winorder-Function umgeschrieben. MUSS vor dem Catch-All stehen.
[[redirects]]
  from = "/wo/*"
  to = "/.netlify/functions/winorder/:splat"
  status = 200

# Restaurant-Slug -> generierte SEO-Page (falls vorhanden), sonst SPA
# Pretty URLs: Netlify serviert automatisch /lapiazza.html bei Aufruf /lapiazza
# Dieser Catch-All ist der SPA-Fallback fuer Routen ohne generierte HTML-Datei.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Waechter: alle 15 Min die Fehler lesen, die im Betrieb aufgelaufen sind --
# Bestellungen, die nicht gespeichert wurden oder nach dem Speichern weg waren.
# Diese Ereignisse schreibt die App seit dem Bestellverlust-Fix ins Protokoll;
# gelesen hat sie bisher niemand. Laeuft serverseitig, also auch nachts und
# auch dann, wenn die App bei niemandem offen ist.
[functions."waechter"]
  schedule = "*/15 * * * *"

# Melder: JEDE MINUTE. Zwei Stufen -- sofort melden, was hereingekommen
# ist (push_sent_at leer), und nach 20 Minuten erinnern, was immer noch
# offen liegt (reminder_sent_at leer).
#
# Vorher lief das alle 10 Minuten und meldete nur Ueberfaelliges. Eine
# Reservierung um 21 Uhr erreichte den Wirt fruehestens um 21:20 -- und
# nur, wenn er bis dahin nicht reagiert hatte. Eine Meldung BEIM EINGANG
# gab es nirgends.
[functions."pending-reminder"]
  schedule = "* * * * *"

# Gastweg-Wache: alle 15 Minuten eine Probe-Reservierung -- genau so, wie
# ein Gast sie macht, ohne Anmeldung, ohne Sonderrechte. Geht sie nicht
# durch, klingelt das Handy des Betreibers.
#
# Am 25.08.2026 wurden vier Gaeste an einem Tag abgewiesen, und es hat
# TAGE gedauert, bis es jemand merkte: der Betreiber ist angemeldet, fuer
# ihn ging alles, und der Gast beschwert sich nicht -- er geht weg.
#
# Unsere 3947 Tests lesen Quelltext. Sie haetten diesen Fehler NIE
# gefunden, weil er nicht im Quelltext stand, sondern in einer Regel in
# der Datenbank. Ein Test, der die echte Tuer benutzt, kann nicht gruen
# sein, waehrend die Tuer klemmt.
[functions."gastweg-wache"]
  schedule = "*/15 * * * *"

# Stempelkarten-Push: alle 4h Kunden re-engagen
# (9/10 Stempel, 10/10 Belohnung wartet, 2/7 Tage inaktiv)
[functions."loyalty-push"]
  schedule = "0 */4 * * *"

# Bewertungs-Nachfass: stuendlich pruefen, welche Bestellungen vor 18-48h
# abgeschlossen wurden -> "Wie war's?"-Push mit Bewertungs-Deep-Link
[functions."review-push"]
  schedule = "14 * * * *"

# Feierabend-Report: taeglich 21:30 UTC (= 23:30 Sommer / 22:30 Winter dt. Zeit)
# Tageszusammenfassung per E-Mail an jeden Gastronomen (Umsatz, Top-Gerichte,
# Reservierungen morgen). Ohne RESEND_API_KEY still inaktiv.
[functions."daily-report"]
  schedule = "30 21 * * *"

# Reservierungs-Erinnerung gegen No-Shows: stuendlich, sendet aber nur im
# Fenster 9-11 Uhr deutscher Zeit an Gaeste mit bestaetigter Reservierung heute.
[functions."reservation-reminder"]
  schedule = "25 * * * *"

# Bewertungs-Nachfass per E-Mail: stuendlich, sendet aber nur 11-19 Uhr.
# Ergaenzt review-push (der erreicht nur die 36 Geraete mit Push-Erlaubnis
# und kennt nur Bestellungen). Hier kommen vor allem die Reservierungen
# dazu - die groesste bisher ungenutzte Quelle.
[functions."review-mail"]
  schedule = "45 * * * *"

# Wochenreport: montags 06:30 UTC (= 08:30 Sommer dt. Zeit) -- ganze Vorwoche
# (Umsatz vs. Woche davor, staerkster Tag, Top-5-Gerichte) an jeden Gastronomen.
[functions."weekly-report"]
  schedule = "30 6 * * 1"
