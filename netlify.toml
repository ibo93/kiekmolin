# Kiek mol in - Netlify Konfiguration

[build]
  # 1. OSM-Import: holt alle Gastro-Betriebe der Region frisch nach prospects.json
  #    (Netlify-Build hat Internet -> Overpass erreichbar). Daraus baut Schritt 2
  #    die Verzeichnis-/SEO-Seiten der Nicht-Partner (mehr Google-Reichweite).
  # 2. SEO-Landing-Pages aus Supabase (Partner) + prospects.json (Nicht-Partner).
  # Fault-tolerant: Schlaegt ein Schritt fehl, wird trotzdem deployed.
  command = "node import-osm.js || echo 'OSM import failed - continuing'; node build-seo-pages.js || echo 'SEO build script failed - continuing'; node minify-build.js || echo 'Minify failed - continuing'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Cache-Header: index.html und sw.js NIE laenger cachen, damit Nutzer nach
# einem Deploy sofort die neue Version bekommen (sonst haelt der Browser eine
# alte Kopie zurueck). sw.js wird zusaetzlich pro Build neu gestempelt.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Pretty URLs ohne .html
[[redirects]]
  from = "/pizzeria-:city"
  to = "/pizzeria-:city.html"
  status = 200

[[redirects]]
  from = "/doener-:city"
  to = "/doener-:city.html"
  status = 200

[[redirects]]
  from = "/fischrestaurant-:city"
  to = "/fischrestaurant-:city.html"
  status = 200

[[redirects]]
  from = "/griechisches-restaurant-:city"
  to = "/griechisches-restaurant-:city.html"
  status = 200

# Hinweis: /restaurant-:city gibt es bewusst NICHT -- der Generator ueberspringt
# die Kategorie "restaurant" (nur /restaurants-:city als Ortsuebersicht).

[[redirects]]
  from = "/cafe-:city"
  to = "/cafe-:city.html"
  status = 200

[[redirects]]
  from = "/restaurants-:city"
  to = "/restaurants-:city.html"
  status = 200

# Englische SEO-Seiten unter /en/...  (Pretty URLs ohne .html)
[[redirects]]
  from = "/en/pizzeria-:city"
  to = "/en/pizzeria-:city.html"
  status = 200

[[redirects]]
  from = "/en/doener-:city"
  to = "/en/doener-:city.html"
  status = 200

[[redirects]]
  from = "/en/fischrestaurant-:city"
  to = "/en/fischrestaurant-:city.html"
  status = 200

[[redirects]]
  from = "/en/griechisches-restaurant-:city"
  to = "/en/griechisches-restaurant-:city.html"
  status = 200

[[redirects]]
  from = "/en/restaurants-:city"
  to = "/en/restaurants-:city.html"
  status = 200

# WinOrder-Kassen-Schnittstelle: WinOrder pollt /wo/<restaurant>/<key>/GetNewOrders
# usw. -> wird auf die winorder-Function umgeschrieben. MUSS vor dem Catch-All stehen.
[[redirects]]
  from = "/wo/*"
  to = "/.netlify/functions/winorder/:splat"
  status = 200

# Restaurant-Slug -> generierte SEO-Page (falls vorhanden), sonst SPA
# Pretty URLs: Netlify serviert automatisch /lapiazza.html bei Aufruf /lapiazza
# Dieser Catch-All ist der SPA-Fallback fuer Routen ohne generierte HTML-Datei.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Waechter: alle 15 Min die Fehler lesen, die im Betrieb aufgelaufen sind --
# Bestellungen, die nicht gespeichert wurden oder nach dem Speichern weg waren.
# Diese Ereignisse schreibt die App seit dem Bestellverlust-Fix ins Protokoll;
# gelesen hat sie bisher niemand. Laeuft serverseitig, also auch nachts und
# auch dann, wenn die App bei niemandem offen ist.
[functions."waechter"]
  schedule = "*/15 * * * *"

# Scheduled Function: alle 10 Min ueberfaellige Pending-Bestellungen/Reservierungen
# erinnern (Push an Gastronomen-Geraete wenn nicht innerhalb 30 Min bestaetigt/abgelehnt)
[functions."pending-reminder"]
  schedule = "*/10 * * * *"

# Stempelkarten-Push: alle 4h Kunden re-engagen
# (9/10 Stempel, 10/10 Belohnung wartet, 2/7 Tage inaktiv)
[functions."loyalty-push"]
  schedule = "0 */4 * * *"

# Bewertungs-Nachfass: stuendlich pruefen, welche Bestellungen vor 18-48h
# abgeschlossen wurden -> "Wie war's?"-Push mit Bewertungs-Deep-Link
[functions."review-push"]
  schedule = "14 * * * *"

# Feierabend-Report: taeglich 21:30 UTC (= 23:30 Sommer / 22:30 Winter dt. Zeit)
# Tageszusammenfassung per E-Mail an jeden Gastronomen (Umsatz, Top-Gerichte,
# Reservierungen morgen). Ohne RESEND_API_KEY still inaktiv.
[functions."daily-report"]
  schedule = "30 21 * * *"

# Reservierungs-Erinnerung gegen No-Shows: stuendlich, sendet aber nur im
# Fenster 9-11 Uhr deutscher Zeit an Gaeste mit bestaetigter Reservierung heute.
[functions."reservation-reminder"]
  schedule = "25 * * * *"

# Wochenreport: montags 06:30 UTC (= 08:30 Sommer dt. Zeit) -- ganze Vorwoche
# (Umsatz vs. Woche davor, staerkster Tag, Top-5-Gerichte) an jeden Gastronomen.
[functions."weekly-report"]
  schedule = "30 6 * * 1"
