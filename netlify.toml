# The Chef – Netlify Konfiguration

[build]
  # Kein Build nötig: index.html wird direkt ausgeliefert, Functions werden
  # automatisch gebündelt (Dependencies aus netlify/functions/package.json).
  command = "echo 'The Chef – kein Build-Schritt nötig'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Serverless-Functions (The Chef: KI-Chat, Stimme, Beleg-/Kassen-/Lager-Scan)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
