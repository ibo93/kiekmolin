# The Chef – Netlify Konfiguration

[build]
  # Kein Build noetig: index.html wird direkt ausgeliefert, Functions werden
  # automatisch gebuendelt (Dependencies aus netlify/functions/package.json).
  # WICHTIG: Kommando bewusst als reines ASCII halten - Sonderzeichen
  # (Gedankenstrich, Umlaute) im command koennen den Build mit exit code 2 killen.
  command = "echo build-ok"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Serverless-Functions (The Chef: KI-Chat, Stimme, Beleg-/Kassen-/Lager-Scan)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Geplante Funktion: prüft alle 15 Minuten fällige Erinnerungen und schickt Push.
[functions."reminders-cron"]
  schedule = "*/15 * * * *"
