<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Herdem Frischmarkt · jederzeit">
  <title>Herdem Frischmarkt</title>
  <desc>Logo des Herdem Frischmarkt, Brückstraße 5, 26409 Wittmund</desc>

  <!-- Schwarzer Hintergrund -->
  <rect width="500" height="500" fill="#000000"/>

  <!-- HERDEM (groß, kräftig grün) -->
  <text x="250" y="245"
        text-anchor="middle"
        font-family="'Anybody', 'Archivo Black', 'Impact', 'Inter', system-ui, sans-serif"
        font-weight="900"
        font-size="92"
        letter-spacing="0"
        fill="#5BB236">HERDEM</text>

  <!-- Trennlinien links und rechts von FRISCHMARKT -->
  <line x1="80" y1="298" x2="140" y2="298" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="360" y1="298" x2="420" y2="298" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- FRISCHMARKT (mittig weiß) -->
  <text x="250" y="307"
        text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="24"
        letter-spacing="4"
        fill="#FFFFFF">FRISCHMARKT</text>

  <!-- Dekorative Linien und Schmuckpunkte um „jederzeit" -->
  <line x1="70" y1="358" x2="180" y2="358" stroke="#E9A02E" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="320" y1="358" x2="430" y2="358" stroke="#E9A02E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Kleine Akzent-Diamanten neben „jederzeit" -->
  <path d="M 184 354 l 4.5 4 l -4.5 4 l -4.5 -4 z" fill="#E9A02E"/>
  <path d="M 316 354 l 4.5 4 l -4.5 4 l -4.5 -4 z" fill="#E9A02E"/>

  <!-- jederzeit (italic, golden, geschwungen) -->
  <text x="250" y="370"
        text-anchor="middle"
        font-family="'Snell Roundhand', 'Apple Chancery', 'Lucida Handwriting', 'Brush Script MT', cursive"
        font-style="italic"
        font-weight="500"
        font-size="30"
        letter-spacing="1"
        fill="#E9A02E">jederzeit</text>
</svg>
