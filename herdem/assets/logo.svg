<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Herdem Frischmarkt">
  <title>Herdem Frischmarkt</title>
  <!-- Schwarzer Hintergrund mit abgerundeten Ecken (Marken-Identität Logo Frischmarkt) -->
  <rect width="200" height="200" rx="44" fill="#000000"/>
  <!-- Großes "H" in Markengrün (#5BB236 wie im echten Logo) -->
  <path d="M50 50h22v36h56V50h22v100h-22v-42H72v42H50z" fill="#5BB236"/>
  <!-- Amber-Akzentpunkt wie das "jederzeit"-Schmuck-Element -->
  <circle cx="160" cy="60" r="9" fill="#E9A02E"/>
</svg>
